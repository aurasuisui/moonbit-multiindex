name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain install: official channel, version printed, NOT pinned.
      #
      # Why not a pinned version string: cli.moonbitlang.com only serves `latest`.
      # Twelve spellings of the toolchain we develop against (0.1.20261012,
      # 0.1.20261012+<hash>, %2B-encoded, -dev, v-prefixed, and the neighbouring
      # dates 20261011/20261013) all answer 403; only `latest` answers 200.
      # `hustcer/setup-moonbit@v1` with `version: 0.1.20261012` fails the same
      # way inside its own download step -- that was the real cause of the
      # 13-second red runs, not the code.
      #
      # Consequence: toolchain drift is detected, not prevented. If upstream
      # floats to a toolchain that reformats code, `moon fmt --check` goes red
      # and the log prints the exact version that did it. Bump deliberately in a
      # separate, fully green commit (AGENTS.md).
      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version

      - name: Toolchain version (recorded in the log)
        run: moon version

      - name: Format check
        run: moon fmt --check

      - name: Type check
        run: moon check

      # Zero-warning gate (docs/STYLE.md §H): warnings are errors here, on every
      # target the package claims to support. Deliberately NOT enabled elsewhere:
      #   * `moon bundle --all` panics on moon 0.1.20260920
      #     ("declared execution output has multiple producers") — do not add it;
      #   * `+unnecessary_annotation` fires 30x [0073], 12 of them on the intentional
      #     black-box `@aurasuisui/multiindex.` prefix — do not enable it.
      # Warning 0074 (missing_doc) is enabled per package in src/moon.pkg, so this
      # step also fails on any public definition without a `///` doc block.
      - name: Warning check (deny-warn, all targets)
        run: moon check --deny-warn --target all

      # The generated interface is a checked-in snapshot, so it must be
      # regenerated when a public signature changes. One wrinkle: `moon info`'s
      # spelling drifts with the toolchain. 0.1.20261012 prints `Int` where
      # 0.1.20261016 prints the canonical `Int32` -- the same type, two
      # spellings. Folding the spellings before comparing keeps the gate honest:
      # an added/removed/renamed public item or a real parameter-type change is
      # still caught, while the spelling drift that a floating CI cannot avoid
      # is not. (Verified 2026-10-20: the whole CI-vs-local diff was exactly
      # Int32 -> Int, nothing else.)
      - name: Interface check (mbti up-to-date)
        run: |
          moon info
          sed -E 's/\bInt32\b/Int/g' src/pkg.generated.mbti > /tmp/mbti.new
          git show HEAD:src/pkg.generated.mbti | sed -E 's/\bInt32\b/Int/g' > /tmp/mbti.old
          git checkout -- src/pkg.generated.mbti
          if ! diff -u /tmp/mbti.old /tmp/mbti.new; then
            echo "::error::src/pkg.generated.mbti is stale -- run 'moon info' and commit the result"
            exit 1
          fi

          # Version single-source check. `moon.mod` carries the package version
          # (what mooncakes and resolvers see); `src/lib.mbt`'s `VERSION` is the
          # copy a consumer reads at run time. `moon info` happily snapshots a
          # stale constant, so without this the two can drift silently.
          mod_ver=$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)
          lib_ver=$(sed -n 's/^pub const VERSION : String = "\(.*\)"/\1/p' src/lib.mbt)
          if [ "$mod_ver" != "$lib_ver" ]; then
            echo "::error::version mismatch: moon.mod='$mod_ver' src/lib.mbt VERSION='$lib_ver'"
            exit 1
          fi
          echo "version: $mod_ver (moon.mod == src/lib.mbt VERSION)"

      - name: Run tests
        run: moon test

      # The README claims four backends (wasm / wasm-gc / js / native); the bare
      # `moon test` above exercises only the default one. This is the step that
      # makes "148/148 on every target" checkable in the log. It runs after the
      # default target so a backend-specific failure stays distinguishable.
      - name: Run tests (all targets)
        run: moon test --target all

      - name: Build
        run: moon build

  # The example is what a reader copies out of the README, so it gets its own job:
  # it must actually *run*, not merely compile.
  #
  # `cmd/leaderboard` is a standalone module whose manifest names a *published*
  # version, so a bare checkout would silently run the registry copy instead of
  # this tree. `moon.work` is the verified local-workspace recipe (no `[workspace]`
  # header, three members; it is gitignored). The trap removes it even when the run
  # fails, so no workspace manifest can leak into the working tree.
  example-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version (recorded in the log)
        run: moon version

      - name: Example run (cmd/leaderboard)
        run: |
          root="$PWD"
          trap 'rm -f "$root/moon.work"' EXIT
          printf 'members = [".", "bench", "cmd/leaderboard"]\n' > moon.work

          cd cmd/leaderboard
          moon run . > "$RUNNER_TEMP/example.log" 2>&1 || { cat "$RUNNER_TEMP/example.log"; exit 1; }
          cat "$RUNNER_TEMP/example.log"

          # A run that produced no output, or stopped halfway, must not pass: check
          # for the demo's own landmarks, not just the exit code.
          grep -q '^== aurasuisui/multiindex VERSION:' "$RUNNER_TEMP/example.log"
          grep -q '^== adding players ==' "$RUNNER_TEMP/example.log"
          grep -q 'verify_invariants: Ok' "$RUNNER_TEMP/example.log"

          # The printed VERSION must be *this repo's* version. The registry copy is
          # pinned at an older version in cmd/leaderboard/moon.mod, so this line is
          # the proof that the workspace member won and the local source ran.
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' "$root/moon.mod")
          grep -q "VERSION: $ver (local workspace module)" "$RUNNER_TEMP/example.log"
          echo "example ran against local source (version $ver)"
